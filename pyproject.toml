[project]
name = "medium-writer-mcp"
dynamic = ["version"]
description = "MCP server for reading Medium and getting your articles Medium-ready, no API token needed"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Asher" }]
keywords = ["mcp", "medium", "claude", "model-context-protocol", "writing", "blogging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["mcp>=2.3,<3", "truststore>=0.9"]

[project.urls]
Homepage = "https://github.com/MuhammadAsher/medium-mcp"
Issues = "https://github.com/MuhammadAsher/medium-mcp/issues"
Changelog = "https://github.com/MuhammadAsher/medium-mcp/blob/main/CHANGELOG.md"

[project.scripts]
medium-writer-mcp = "medium_mcp.server:main"
medium-mcp = "medium_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/medium_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/medium_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
