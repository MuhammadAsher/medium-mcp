[project]
name = "medium-mcp"
version = "0.1.0"
description = "MCP server for reading Medium feeds and preparing/publishing Medium articles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.3,<3", "truststore>=0.9"]

[project.scripts]
medium-mcp = "medium_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medium_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
